settings:
  # Enabling of disabling whitelist: true, false.
  enable: false
  # Storage type: yml, mysql
  storage-type: yml

database: # If storage type is mysql
  host: localhost:3306
  name: database
  username: root
  password: password
  # Additional JDBC connection options (appended to the URL as query string)
  connectionOptions: "autoReconnect=true&connectTimeout=10000&socketTimeout=60000&useSSL=false&serverTimezone=UTC&characterEncoding=utf8"
  # Connection pool settings (for 2000+ players)
  pool-size: 10
  connection-timeout: 30000
  idle-timeout: 600000
  max-lifetime: 1800000
  # Full cache re-sync interval in minutes (to pick up changes from external sources like websites/consoles)
  # Set to 3 minutes to avoid database overloading and rate-limiting.
  sync-interval: 3

messages:
  kick-message: |-
    &cYou are not whitelisted on this server!
  database-not-ready: |-
    &cDatabase is not ready yet!
    &7Please wait a moment or contact administration.
  database-error: "&2NBWL &7> &cDatabase is not ready yet! Please wait or contact administration."
  no-permissions: "&2NBWL &7> &cYou do not have permission."
  player-add: "&2NBWL &7> &a%player% &7added to the whitelist."
  player-remove: "&2NBWL &7> &c%player% &7removed from the whitelist."
  player-already-exists: "&2NBWL &7> &e%player% &7is already on the whitelist."
  player-not-found: "&2NBWL &7> &c%player% &7not found on the whitelist."
  plugin-reload: "&2NBWL &7> &aConfiguration reloaded."
  plugin-enable: "&2NBWL &7> &aWhitelist enabled."
  plugin-disable: "&2NBWL &7> &cWhitelist disabled."
  plugin-usage: "&2NBWL &7> &fPlugin usage:\n &7/nbwl reload &f- Reload configuration.\n &7/nbwl add|remove <player> &f- Add or remove player from whitelist.\n &7/nbwl enable|disable &f- Enable or disable whitelist."

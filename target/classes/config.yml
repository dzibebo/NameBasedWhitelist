    &#94DCC3▢ &#ffffffᴡʜɪᴛᴇʟɪꜱᴛ ʙыᴋлючᴇʜ.'
  plugin-usage: ' &#CDDEDFꜰ&#C7DDD3ᴏ&#C1DDC6x&#BEDDC0ᴡ&#BBDCBAᴀ&#AEDCBDʀ&#A1DCC0ᴅ
    &#94DCC3▢ &#ffffffиᴄпᴏльзуйᴛᴇ: &#D4EECC/ɴʙᴡʟ ᴀᴅᴅ&#ffffff|&#D4EECCʀᴇᴍᴏᴠᴇ <ʜиᴋʜᴇйᴍ
    для дᴏбᴀʙлᴇʜия или удᴀлᴇʜия игᴘᴏᴋᴀ из ʙᴀйᴛлиᴄᴛᴀ'